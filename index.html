<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div class="box" id="box1">
            <h1>Pokemon Details</h1>
            <div id="left1">
                <p>Name</p>
                <p id="mainName"></p>
            </div>
            <div id="left2">
                <p>ID</p>
                <p id="mainId"></p>
            </div>
            <div id="left3">
                <p>Type</p>
                <p  id="mainType"></p>
            </div>
            <div id="left4">
                <p>Ability</p>
                <p  id="mainAbility"></p>
            </div>
            <div id="left5">
                <p>Height</p>
                <p  id="mainHeight"></p>
            </div>
            <div id="left6">
                <p>Weight</p>
                <p id="mainWeight"></p>
            </div>
            <h1>Stats</h1>
            <div id="left7">
                <p>HP</p>
                <p id="mainHp"></p>
            </div>
            <div id="left8">
                <p>Attack</p>
                <p id="mainAttack"></p>
            </div>
            <div id="left9">
                <p>Defense</p>
                <p id="mainDef"></p>
            </div>
            <div id="left10">
                <p>Sp. Atk</p>
                <p id="mainSpatk"></p>
            </div>
            <div id="left11">
                <p>Sp. Def</p>
                <p id="mainSpdef"></p>
            </div>
            <div id="left12">
                <p>Speed</p>
                <p id="mainSpeed"></p>
            </div>

        </div>
        <div class="box" id="box2">
            <div id="imgbox">
                <img src="" alt="" style="display: none;" id="mainImg">
            </div>
            <div id="box2btn">
                <button>Random Pokemon</button>
            </div>
        </div>
        <div class="box" id="box3">
            <h1>Current Moves Set</h1>
            <div>skill1</div>
            <div>skill2</div>
            <div>skill3</div>
            <div>skill4</div>
        </div>
        <div class="box" id="box4">
            <div id="Pokemon1">
                <div id="Pokemon1Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 1</div>
            </div>
            <div id="Pokemon2">
                <div id="Pokemon2Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 2</div>
            </div>
            <div id="Pokemon3">
                <div id="Pokemon3Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 3</div>
            </div>
            <div id="Pokemon4">
                <div id="Pokemon4Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 4</div>
            </div>
            <div id="Pokemon5">
                <div id="Pokemon5Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 5</div>
            </div>
            <div id="Pokemon6">
                <div id="Pokemon6Img"></div>
                <div id="Pokemon1Name">Pokemon Slot 6</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
